<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Original oil paintings by Jakub Pustay. Available works, commissions, and contact.">
<title>Jakub Pustay — Paintings</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Alex+Brush&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#161616;--muted:#8a8a8a;--line:#e9e9e6;--cap:rgba(255,255,255,.94)}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit;appearance:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h2{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}

header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;text-align:center;padding:48px 6% 24px}
.sig{font-family:'Alex Brush',cursive;font-size:44px;line-height:1;margin:0 0 20px;font-weight:400}
nav{display:flex;justify-content:center;gap:26px}
nav button{padding:4px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent}
nav button.active{color:var(--fg);border-color:var(--fg)}

main{max-width:1400px;margin:0 auto}
section{display:none;padding:8px 6% 72px}
section.active{display:block}
#contact,#commissions{padding-top:32px}

.grid{column-count:3;column-gap:14px}
.art{break-inside:avoid;margin-bottom:14px;position:relative;overflow:hidden;cursor:pointer}
.art img{width:100%;display:block}
.cap{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;background:var(--cap);font-size:12px;display:flex;justify-content:space-between;gap:10px;opacity:0;transition:opacity .18s}
.art:hover .cap,.art:focus-within .cap{opacity:1}
.cap b{font-weight:500}

.lead{color:var(--muted);font-size:14px;margin:0 0 30px;max-width:52ch}
.calc{display:grid;gap:16px;max-width:340px}
.calc label{display:block;font-size:12px;color:var(--muted)}
.calc select{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);background:var(--bg);font:inherit;color:var(--fg)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg)}
.chk input{width:16px;height:16px;accent-color:var(--fg)}
.price{margin-top:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.price b{display:block;font-size:24px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);margin-top:3px}
.cta{margin-top:4px;padding:13px 24px;background:var(--fg);color:#fff;font-size:13px;letter-spacing:.03em;width:fit-content}
.steps{list-style:none;padding:0;margin:52px 0 0;display:grid;gap:13px;max-width:420px}
.steps li{font-size:13px;color:var(--muted)}
.steps b{color:var(--fg);font-weight:500;margin-right:6px}

.contact a{display:block;font-size:19px;margin:6px 0;text-decoration:none;width:fit-content;border-bottom:1px solid transparent}
.contact a:hover{border-color:var(--fg)}

footer{text-align:center;padding:36px 0 calc(36px + env(safe-area-inset-bottom,0px))}
footer a{display:inline-flex;opacity:.55}
footer a:hover{opacity:1}

.lb{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.lb .x{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:20px;font-size:26px;color:var(--muted)}
.lb img{max-width:min(88vw,880px);max-height:56vh;object-fit:contain}
.info{text-align:center;margin-top:16px;color:var(--muted);font-size:13px;line-height:1.5}
.info b{display:block;font-size:17px;color:var(--fg);font-weight:500;margin-bottom:6px}
#lbMeta div{margin:1px 0}
#lbPrice{color:var(--fg);font-size:14px;margin-top:6px}
#lbStatus{font-size:11px;letter-spacing:.08em;margin-top:2px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots button{width:6px;height:6px;border-radius:50%;background:var(--line);padding:0}
.dots button.on{background:var(--fg)}

@media(max-width:900px){
  .grid{column-count:2}
  section{padding:8px 20px 60px}
  header{padding:36px 20px 20px}
  .sig{font-size:36px}
}
</style>
</head>
<body>

<header>
  <div class="sig">Jakub Pustay</div>
  <nav>
    <button data-tab="portfolio" class="active">Portfolio</button>
    <button data-tab="commissions">Commissions</button>
    <button data-tab="contact">Contact</button>
  </nav>
</header>

<main>
  <section id="portfolio" class="active"><div class="grid" id="grid"></div></section>

  <section id="commissions">
    <h2>Commissions</h2>
    <p class="lead">Original oil paintings made from your photograph.</p>
    <div class="calc">
      <label>Type
        <select id="cType"><option>Pet</option><option>Portrait</option><option>Landscape</option><option>Other</option></select>
      </label>
      <label>Size
        <select id="cSize"></select>
      </label>
      <label class="chk"><input type="checkbox" id="cFrame"> Framed <span style="color:var(--muted)">(+1,500 Kč)</span></label>
      <div class="price">Estimated price<b id="cPrice"></b></div>
      <button class="cta" id="cStart">Start a commission</button>
    </div>
    <ol class="steps">
      <li><b>01 —</b>Send a photograph</li>
      <li><b>02 —</b>Agree on the details</li>
      <li><b>03 —</b>I paint it</li>
      <li><b>04 —</b>Receive the finished painting</li>
    </ol>
  </section>

  <section id="contact" class="contact">
    <h2>Contact</h2>
    <a href="tel:+420XXXXXXXXX">+420 XXX XXX XXX</a>
    <a href="mailto:hello@example.com">hello@example.com</a>
  </section>
</main>

<footer>
  <a href="https://instagram.com/YOURHANDLE" target="_blank" rel="noopener" aria-label="Instagram">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.2" cy="6.8" r="1"/></svg>
  </a>
</footer>

<div class="lb" id="lb" hidden>
  <button class="x" aria-label="Close">×</button>
  <img id="lbImg" alt="">
  <div class="dots" id="dots"></div>
  <div class="info">
    <b id="lbTitle"></b>
    <div id="lbMeta"></div>
    <div id="lbPrice"></div>
    <div id="lbStatus"></div>
  </div>
</div>

<script>
// Pricing config — edit freely, the calculator reads straight from this object.
const PRICING = {
  sizes:{'20 × 30 cm':5500,'30 × 40 cm':7500,'40 × 50 cm':10000,'50 × 70 cm':15000},
  frame:1500
};

// Placeholder painting photos (soft abstract fields, two variants for multi-photo demo).
function ph(h,w,ht){const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ht}"><rect width="100%" height="100%" fill="hsl(${h},20%,90%)"/><circle cx="${w*.48}" cy="${ht*.4}" r="${Math.min(w,ht)*.3}" fill="hsl(${h},26%,78%)"/></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(s);}
function ph2(h,w,ht){const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${ht}"><rect width="100%" height="100%" fill="hsl(${h},18%,86%)"/><circle cx="${w*.3}" cy="${ht*.5}" r="${Math.min(w,ht)*.22}" fill="hsl(${h},28%,72%)"/><circle cx="${w*.68}" cy="${ht*.35}" r="${Math.min(w,ht)*.16}" fill="hsl(${h},24%,80%)"/></svg>`;return 'data:image/svg+xml,'+encodeURIComponent(s);}

// ARTWORKS — add a painting by adding an object here. images[0] is always the grid thumbnail.
const artworks = [
  {id:'plod',title:'Plod',year:2026,medium:'Oil on canvas',dimensions:'30 × 40 cm',price:7500,currency:'CZK',status:'available',images:[ph(18,900,1150),ph2(18,900,1150)]},
  {id:'steady-hands',title:'Steady Hands',year:2025,medium:'Oil on canvas',dimensions:'50 × 40 cm',status:'sold',images:[ph(205,1150,900)]},
  {id:'quiet-hour',title:'Quiet Hour',year:2025,medium:'Oil on canvas',dimensions:'40 × 40 cm',price:6500,currency:'CZK',status:'available',images:[ph(42,1000,1000)]},
  {id:'night-walk',title:'Night Walk',year:2026,medium:'Oil on canvas',dimensions:'30 × 60 cm',price:9500,currency:'CZK',status:'available',images:[ph(258,800,1500),ph2(258,800,1500)]},
  {id:'poppy-field',title:'Poppy Field',year:2025,medium:'Oil on canvas',dimensions:'70 × 35 cm',price:8500,currency:'CZK',status:'available',images:[ph(96,1500,760)]},
  {id:'untitled-3',title:'Untitled No. 3',year:2024,medium:'Oil on canvas',dimensions:'35 × 45 cm',status:'sold',images:[ph(8,900,1150)]}
];

const grid=document.getElementById('grid'), lb=document.getElementById('lb');
let cur=null, imgIdx=0;

function renderGrid(){
  grid.innerHTML = artworks.map(a=>`
    <div class="art" data-id="${a.id}" tabindex="0">
      <img src="${a.images[0]}" alt="${a.title}, oil painting by Jakub Pustay, ${a.year}" loading="lazy">
      <div class="cap"><span>${a.title}</span><span>${a.status==='sold' ? '<b>SOLD</b>' : (a.price ? `<b>${a.price.toLocaleString()} ${a.currency||''}</b>` : '')}</span></div>
    </div>`).join('');
  grid.querySelectorAll('.art').forEach(el=>{
    el.onclick=()=>{location.hash='portfolio/'+el.dataset.id;};
    el.onkeydown=e=>{if(e.key==='Enter')location.hash='portfolio/'+el.dataset.id;};
  });
}

function openLB(id){
  cur = artworks.find(a=>a.id===id); if(!cur) return;
  imgIdx = 0; renderLB(); lb.hidden = false; document.body.style.overflow='hidden';
  lb.querySelector('.x').focus();
}
function closeLB(){ lb.hidden = true; document.body.style.overflow=''; if(location.hash.startsWith('#portfolio/')) location.hash='portfolio'; }
function renderLB(){
  document.getElementById('lbImg').src = cur.images[imgIdx];
  document.getElementById('lbImg').alt = `${cur.title}, oil painting by Jakub Pustay, ${cur.year}`;
  document.getElementById('lbTitle').textContent = cur.title;
  document.getElementById('lbMeta').innerHTML = [cur.year,cur.medium,cur.dimensions].filter(Boolean).map(x=>`<div>${x}</div>`).join('');
  document.getElementById('lbPrice').textContent = (cur.status!=='sold' && cur.price) ? `${cur.price.toLocaleString()} ${cur.currency||''}`.trim() : '';
  document.getElementById('lbStatus').textContent = cur.status==='sold' ? 'SOLD' : (cur.price ? 'AVAILABLE' : '');
  const dots=document.getElementById('dots');
  dots.innerHTML = cur.images.length>1 ? cur.images.map((_,i)=>`<button class="${i===imgIdx?'on':''}" data-i="${i}" aria-label="Image ${i+1} of ${cur.images.length}"></button>`).join('') : '';
  dots.querySelectorAll('button').forEach(b=>b.onclick=()=>{imgIdx=+b.dataset.i;renderLB();});
}
function navImg(d){ if(!cur || cur.images.length<2) return; imgIdx=(imgIdx+d+cur.images.length)%cur.images.length; renderLB(); }
document.querySelector('.lb .x').onclick = closeLB;
lb.addEventListener('click', e=>{ if(e.target===lb) closeLB(); });
document.addEventListener('keydown', e=>{
  if(lb.hidden) return;
  if(e.key==='Escape') closeLB();
  if(e.key==='ArrowRight') navImg(1);
  if(e.key==='ArrowLeft') navImg(-1);
  if(e.key==='Tab'){
    const f=[...lb.querySelectorAll('button')];
    const i=f.indexOf(document.activeElement);
    if(e.shiftKey && i<=0){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && i===f.length-1){ e.preventDefault(); f[0].focus(); }
  }
});
let tX=0;
document.getElementById('lbImg').addEventListener('touchstart', e=>tX=e.touches[0].clientX);
document.getElementById('lbImg').addEventListener('touchend', e=>{ const d=e.changedTouches[0].clientX-tX; if(Math.abs(d)>40) navImg(d<0?1:-1); });

const sections=[...document.querySelectorAll('section')], navBtns=[...document.querySelectorAll('nav button')];
function showSection(name){
  sections.forEach(s=>s.classList.toggle('active', s.id===name));
  navBtns.forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
}
navBtns.forEach(b=>b.onclick=()=>{ location.hash=b.dataset.tab; });

function route(){
  const parts=(location.hash||'#portfolio').slice(1).split('/');
  showSection(parts[0]||'portfolio');
  if(parts[1]) openLB(parts[1]); else if(!lb.hidden){ lb.hidden=true; document.body.style.overflow=''; }
}
window.addEventListener('hashchange', route);

function populateSizes(){
  const sel=document.getElementById('cSize');
  sel.innerHTML = Object.keys(PRICING.sizes).map(s=>`<option>${s}</option>`).join('');
  calcPrice();
}
function calcPrice(){
  const size=document.getElementById('cSize').value;
  const framed=document.getElementById('cFrame').checked;
  const total=(PRICING.sizes[size]||0)+(framed?PRICING.frame:0);
  document.getElementById('cPrice').textContent = total.toLocaleString()+' Kč';
}
document.getElementById('cSize').addEventListener('change', calcPrice);
document.getElementById('cFrame').addEventListener('change', calcPrice);
document.getElementById('cStart').onclick=()=>{
  const type=document.getElementById('cType').value;
  const size=document.getElementById('cSize').value;
  const frame=document.getElementById('cFrame').checked ? 'Framed' : 'Unframed';
  const price=document.getElementById('cPrice').textContent;
  const body=`Hi Jakub,%0D%0A%0D%0AI'd like to start a commission:%0D%0A- Type: ${type}%0D%0A- Size: ${size}%0D%0A- Presentation: ${frame}%0D%0A- Estimated price: ${price}%0D%0A%0D%0AMy name:%0D%0AMy email or phone:%0D%0A`;
  location.href = `mailto:hello@example.com?subject=${encodeURIComponent('Commission inquiry')}&body=${body}`;
};

renderGrid(); populateSizes(); route();
</script>
</body>
</html>
